 return res===null?1:res}
function score(a,mode){const out={};let t=0;for(const d of D.dims){let s=0;for(const c of D.crits.filter(c=>c.dim===d.id))s+=c.peso*cls(c.codigo,a,mode);out[d.id]=s*d.peso;t+=out[d.id]}return{dim:out,total:t}}
function answered(a){return D.conds.filter(c=>['SIM','NÃO'].includes(get(a.sigla,c.id).r)).length}
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
let tab='rank',ag=D.ag[0].sigla;
const T={rank:'Ranking',ficha:'Ficha da agência',crit:'Critérios',aud:'Como funciona'};
function nav(){document.getElementById('nav').innerHTML=Object.entries(T).map(([k,v])=>`<button class="${k===tab?'on':''}" data-t="${k}">${v}</button>`).join('');
 document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()})}
function rank(){const rows=D.ag.map(a=>({a,e:score(a.sigla,'est'),c:score(a.sigla,'comp'),n:answered(a)}));
 rows.sort((x,y)=>y.e.total-x.e.total);
 return `<div class="card warn">Resposta em branco é <b>sem avaliação</b>, não “não atende”. Enquanto uma agência não tiver condições respondidas, ela aparece sem posição. A nota <b>comprovada</b> exige SIM + URL de evidência + status “validado”.</div>
 <div class="card"><table><tr><th>#</th><th>Agência</th>${D.dims.map(d=>`<th class="n" title="${esc(d.nome)}">${esc(d.nome.split(' (')[0].replace('Gestão do ','').replace('Gestão de ','').replace('Análise de ',''))}<br>(${d.peso})</th>`).join('')}<th class="n">Estimado</th><th class="n">Comprovado</th><th>Respondido</th></tr>
 ${rows.map((r,i)=>`<tr><td>${r.n?i+1:'—'}</td><td><b>${r.a.sigla}</b><div class="sub">${esc(r.a.setor)}</div></td>${D.dims.map(d=>`<td class="n">${r.n?r.e.dim[d.id].toFixed(1):'—'}</td>`).join('')}<td class="n"><b>${r.n?r.e.total.toFixed(1):'—'}</b></td><td class="n">${r.c.total.toFixed(1)}</td><td><div class="bar"><i style="width:${r.n/D.conds.length*100}%"></i></div><span class="sub">${r.n}/${D.conds.length}</span></td></tr>`).join('')}</table></div>
 <button class="act" id="csv">Exportar respostas (CSV)</button>`}
function ficha(){const a=D.ag.find(x=>x.sigla===ag),e=score(ag,'est'),c=score(ag,'comp');
 const sel=`<select id="sel">${D.ag.map(x=>`<option ${x.sigla===ag?'selected':''}>${x.sigla}</option>`).join('')}</select>`;
 let h=`<div class="card"><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">${sel}<div><b>${esc(a.nome)}</b><div class="sub">${esc(a.lei)} · <a href="${a.url}" target="_blank" rel="noopener">portal gov.br</a></div></div></div>
 <div class="kpi" style="margin-top:12px"><div><span class="sub">IMQN estimado</span><b>${e.total.toFixed(1)}</b></div><div><span class="sub">IMQN comprovado</span><b>${c.total.toFixed(1)}</b></div></div></div>`;
 for(const d of D.dims){h+=`<div class="card"><b>${esc(d.nome)}</b> <span class="pill">${e.dim[d.id].toFixed(1)} / ${d.peso}</span>`;
  for(const cr of D.crits.filter(c=>c.dim===d.id)){h+=`<div class="sub" style="margin-top:10px">${esc(cr.nome)} — classificação ${cls(cr.codigo,ag,'est').toFixed(3)} · <a target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent('site:gov.br/'+a.slug+' "'+cr.keywords.split(';')[0].trim()+'"')}">buscar no portal</a></div>`;
   for(const n of NK){const cs=D.conds.filter(x=>x.crit===cr.codigo&&x.nivel===n);h+=`<div class="lv">${NL[n]}</div>`;
    for(const x of cs){const g=get(ag,x.id);h+=`<div class="row"><div>${esc(x.texto)} <span class="pill">${x.verif}</span></div><select data-c="${x.id}" data-f="r"><option value="">—</option>${['SIM','NÃO','?'].map(o=>`<option ${g.r===o?'selected':''}>${o}</option>`).join('')}</select>
     <div class="ev"><input type="url" placeholder="URL da evidência" value="${esc(g.u)}" data-c="${x.id}" data-f="u"><select data-c="${x.id}" data-f="s">${['pendente','preliminar','em_revisao','validado','rejeitado'].map(o=>`<option ${g.s===o?'selected':''}>${o}</option>`).join('')}</select></div></div>`}}}
  h+='</div>'}
 return h}
function crit(){return D.dims.map(d=>`<div class="card"><b>${esc(d.nome)}</b> <span class="pill">peso ${d.peso}</span>${D.crits.filter(c=>c.dim===d.id).map(c=>`<div style="margin-top:10px"><b>${esc(c.nome)}</b> <span class="pill">${c.peso*100}% da dimensão</span><div class="sub">Base legal (a conferir): ${esc(c.base)}</div><div class="sub">Termos: ${esc(c.keywords)}</div><div class="sub">Onde: ${esc(c.onde)}</div></div>`).join('')}</div>`).join('')}
function aud(){return `<div class="card"><b>Regra de nível</b><p>Níveis cumulativos: Inexistente 0 → Inicial 0,35 → Gerenciado 0,70 → Melhoria Contínua 1,00. Nível-base = mais alto com todas as condições atendidas (e as de baixo). A fração do nível seguinte é a proporção das condições dele atendidas. Ex.: Inicial completo + 2 de 4 do Gerenciado = 0,35 + 0,35×0,5 = 0,525.</p><p>Nota da dimensão = Σ(peso do critério × classificação) × peso da dimensão. IMQN = soma das 6 dimensões (0–100).</p><p class="sub">Classificação pública/interna, perguntas e termos de busca são proposta, a validar. Detalhes e auditoria da planilha original: ver o workbook .xlsx.</p></div>`}
function render(){nav();const m=document.getElementById('m');m.innerHTML={rank,ficha,crit,aud}[tab]();
 const s=document.getElementById('sel');if(s)s.onchange=()=>{ag=s.value;render()};
 m.querySelectorAll('[data-c]').forEach(el=>el.onchange=()=>{set(ag,el.dataset.c,{[el.dataset.f]:el.value});const y=scrollY;render();scrollTo(0,y)});
 const b=document.getElementById('csv');if(b)b.onclick=()=>{const L=['agencia,condicao_id,resposta,url_evidencia,status_revisao'];
  for(const a of D.ag)for(const c of D.conds){const g=get(a.sigla,c.id);if(g.r||g.u)L.push([a.sigla,c.id,g.r,g.u,g.s].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','))}
  const u=URL.createObjectURL(new Blob([L.join('\n')],{type:'text/csv'}));const e=document.createElement('a');e.href=u;e.download='imqn_respostas.csv';e.click()}}
render();
</script></body></html>
